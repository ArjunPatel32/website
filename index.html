<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjun Patel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Star field canvas */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Aurora background effect */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .aurora::before,
        .aurora::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(ellipse at 30% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            animation: auroraDrift 20s ease-in-out infinite alternate;
        }

        .aurora::after {
            animation-delay: -10s;
            animation-direction: alternate-reverse;
            opacity: 0.7;
        }

        @keyframes auroraDrift {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(5%, 3%) rotate(2deg) scale(1.05); }
            66% { transform: translate(-3%, 5%) rotate(-1deg) scale(0.98); }
            100% { transform: translate(2%, -2%) rotate(1deg) scale(1.02); }
        }

        /* Profile image */
        .profile-wrapper {
            position: relative;
            margin-bottom: 40px;
            opacity: 0;
            transform: scale(0.8);
            animation: fadeInScale 1s ease-out 0.3s forwards, float 6s ease-in-out infinite 1.3s;
        }

        .profile-wrapper::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899, #f97316, #3b82f6);
            background-size: 400% 400%;
            border-radius: 50%;
            animation: gradientRotate 4s ease infinite, borderGlow 2s ease-in-out infinite alternate;
            z-index: -1;
        }

        .profile-wrapper::after {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -2;
            animation: pulse 4s ease-in-out infinite;
        }

        .profile-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0a0a0f;
            display: block;
            transition: transform 0.3s ease;
        }

        .profile-wrapper:hover .profile-img {
            transform: scale(1.05);
        }

        @keyframes gradientRotate {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes borderGlow {
            0% { filter: blur(0px) brightness(1); }
            100% { filter: blur(2px) brightness(1.2); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Name */
        .name {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out 0.6s forwards;
            background: linear-gradient(90deg, #fff, #a0a0a0, #fff, #8b5cf6, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .name:hover {
            animation: fadeInUp 0.8s ease-out 0.6s forwards, shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .tagline {
            font-size: 1.1rem;
            color: #888;
            font-weight: 400;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out 0.8s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Work badge */
        .work-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(255, 140, 50, 0.1);
            border: 1px solid rgba(255, 140, 50, 0.3);
            border-radius: 50px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.9s forwards;
            transition: all 0.3s ease;
        }

        .work-badge:hover {
            background: rgba(255, 140, 50, 0.15);
            border-color: rgba(255, 140, 50, 0.5);
            transform: translateY(-2px);
        }

        .work-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .work-badge span {
            color: #ff8c32;
            font-weight: 500;
            font-size: 1rem;
        }

        /* Bio section */
        .bio {
            max-width: 550px;
            text-align: left;
            line-height: 1.8;
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
            list-style: none;
            padding: 0;
        }

        .bio li {
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
        }

        .bio li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 50%;
        }

        .bio li:last-child {
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Social links */
        .social-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.2s forwards;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.3));
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 50%;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(139, 92, 246, 0.5);
            color: #fff;
            transform: translateY(-6px) scale(1.1);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.3), 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .social-link:hover svg {
            transform: scale(1.1);
        }

        /* Email link */
        .email-link {
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.4s forwards;
            transition: color 0.3s ease;
        }

        .email-link:hover {
            color: #8b5cf6;
        }

        /* Floating planets */
        .floating-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.6;
        }

        .planet-1 {
            width: 120px;
            height: 120px;
            top: 10%;
            left: 5%;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a 50%, #862e2e);
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.5), 0 0 60px rgba(255, 107, 107, 0.3);
            animation: floatPlanet1 25s ease-in-out infinite;
        }

        .planet-2 {
            width: 80px;
            height: 80px;
            top: 60%;
            right: 8%;
            background: radial-gradient(circle at 30% 30%, #74c0fc, #1c7ed6 50%, #1864ab);
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.5), 0 0 40px rgba(116, 192, 252, 0.3);
            animation: floatPlanet2 30s ease-in-out infinite;
        }

        .planet-3 {
            width: 60px;
            height: 60px;
            top: 75%;
            left: 12%;
            background: radial-gradient(circle at 30% 30%, #b197fc, #7950f2 50%, #5f3dc4);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 0 30px rgba(177, 151, 252, 0.3);
            animation: floatPlanet3 20s ease-in-out infinite;
        }

        /* Saturn-like planet with ring */
        .planet-4 {
            width: 100px;
            height: 100px;
            top: 20%;
            right: 15%;
            background: radial-gradient(circle at 30% 30%, #ffd43b, #fab005 50%, #e67700);
            box-shadow: inset -18px -18px 35px rgba(0,0,0,0.5), 0 0 50px rgba(255, 212, 59, 0.3);
            animation: floatPlanet4 35s ease-in-out infinite;
        }

        .planet-4::after {
            content: '';
            position: absolute;
            width: 160px;
            height: 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            border: 4px solid rgba(255, 212, 59, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 212, 59, 0.2);
        }

        .galaxy {
            position: absolute;
            width: 200px;
            height: 200px;
            top: 40%;
            left: -5%;
            background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.2) 0%, rgba(236, 72, 153, 0.1) 30%, transparent 70%);
            border-radius: 50%;
            transform: rotate(45deg);
            animation: rotateGalaxy 60s linear infinite, floatGalaxy 40s ease-in-out infinite;
            filter: blur(2px);
        }

        @keyframes floatPlanet1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, 20px) rotate(5deg); }
            50% { transform: translate(10px, 40px) rotate(-3deg); }
            75% { transform: translate(-20px, 15px) rotate(2deg); }
        }

        @keyframes floatPlanet2 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-25px, -30px); }
            66% { transform: translate(15px, -15px); }
        }

        @keyframes floatPlanet3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -25px) scale(1.1); }
        }

        @keyframes floatPlanet4 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, 30px) rotate(10deg); }
        }

        @keyframes rotateGalaxy {
            from { transform: rotate(45deg); }
            to { transform: rotate(405deg); }
        }

        @keyframes floatGalaxy {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; left: 0%; }
        }

        /* Floating logos */
        .floating-logo {
            position: absolute;
            width: 40px;
            height: 40px;
            opacity: 0.15;
            filter: grayscale(100%) brightness(2);
            object-fit: contain;
            animation: floatLogo 20s ease-in-out infinite;
            transition: opacity 0.3s ease, filter 0.3s ease;
        }

        .floating-logo:hover {
            opacity: 0.4;
            filter: grayscale(0%) brightness(1);
        }

        .logo-1 { top: 15%; left: 80%; animation-duration: 22s; animation-delay: 0s; }
        .logo-2 { top: 70%; left: 85%; animation-duration: 25s; animation-delay: -5s; }
        .logo-3 { top: 85%; left: 60%; animation-duration: 28s; animation-delay: -10s; }
        .logo-4 { top: 25%; left: 90%; animation-duration: 20s; animation-delay: -3s; }
        .logo-5 { top: 50%; left: 3%; animation-duration: 24s; animation-delay: -8s; }
        .logo-6 { top: 5%; left: 40%; animation-duration: 26s; animation-delay: -12s; }

        @keyframes floatLogo {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -15px) rotate(5deg); }
            50% { transform: translate(-5px, 10px) rotate(-3deg); }
            75% { transform: translate(-15px, -5px) rotate(2deg); }
        }

        /* Poll styles */
        .poll-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 24px;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 1s ease-out 2s forwards;
        }

        .poll-question {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 16px;
            color: #fff;
        }

        .poll-buttons {
            display: flex;
            gap: 12px;
        }

        .poll-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .poll-btn-yes {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .poll-btn-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .poll-btn-no {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            position: relative;
            transition: all 0.15s ease;
        }

        .poll-btn-no:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .poll-result {
            display: none;
            text-align: center;
            font-size: 1.1rem;
            color: #10b981;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .profile-img {
                width: 180px;
                height: 180px;
            }

            .social-links {
                gap: 16px;
            }

            .social-link {
                width: 44px;
                height: 44px;
            }

            .poll-container {
                bottom: 15px;
                right: 15px;
                left: 15px;
            }

            .floating-logo {
                display: none;
            }

            .planet {
                transform: scale(0.6);
            }
        }
    </style>
</head>

        <img src="main/images/nasa_logo.png" alt="" class="floating-logo logo-1">

        <img src="main/images/flow_logo.jpg" alt="" class="floating-logo logo-5">
        <img src="main/images/aces.png" alt="" class="floating-logo logo-6">

                <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>

    </div>

    <script>
        // Animated star field with parallax
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let shootingStars = [];
        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const numStars = Math.floor((canvas.width * canvas.height) / 6000);

            for (let i = 0; i < numStars; i++) {
                stars.push({
                    baseX: Math.random() * canvas.width,
                    baseY: Math.random() * canvas.height,
                    x: 0,
                    y: 0,
                    radius: Math.random() * 1.8 + 0.3,
                    opacity: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinkleOffset: Math.random() * Math.PI * 2,
                    depth: Math.random() * 3 + 1, // Parallax depth
                    color: Math.random() > 0.9 ?
                        `hsl(${Math.random() * 60 + 200}, 70%, 80%)` : // Some colored stars
                        'white'
                });
            }
        }

        // Mouse tracking for parallax
        document.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX - window.innerWidth / 2) / window.innerWidth;
            targetMouseY = (e.clientY - window.innerHeight / 2) / window.innerHeight;
        });

        function createShootingStar() {
            if (Math.random() < 0.003 && shootingStars.length < 3) {
                const startX = Math.random() * canvas.width;
                shootingStars.push({
                    x: startX,
                    y: Math.random() * canvas.height * 0.3,
                    length: Math.random() * 100 + 60,
                    speed: Math.random() * 10 + 8,
                    angle: Math.PI / 4 + (Math.random() * 0.3 - 0.15),
                    opacity: 1,
                    hue: Math.random() * 60 + 200 // Blue to purple hue
                });
            }
        }

        function drawStars(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Smooth mouse movement
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            // Draw regular stars with twinkle and parallax
            stars.forEach(star => {
                const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.3 + 0.7;

                // Parallax effect based on mouse position
                const parallaxX = mouseX * star.depth * 20;
                const parallaxY = mouseY * star.depth * 20;

                star.x = star.baseX + parallaxX;
                star.y = star.baseY + parallaxY;

                // Draw star glow for larger stars
                if (star.radius > 1.2) {
                    const glowGradient = ctx.createRadialGradient(
                        star.x, star.y, 0,
                        star.x, star.y, star.radius * 4
                    );
                    glowGradient.addColorStop(0, `rgba(255, 255, 255, ${star.opacity * twinkle * 0.3})`);
                    glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius * 4, 0, Math.PI * 2);
                    ctx.fillStyle = glowGradient;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color === 'white'
                    ? `rgba(255, 255, 255, ${star.opacity * twinkle})`
                    : star.color.replace('80%', `${80 * twinkle}%`);
                ctx.fill();
            });

            // Draw and update shooting stars
            shootingStars = shootingStars.filter(ss => {
                const vx = Math.cos(ss.angle) * ss.speed;
                const vy = Math.sin(ss.angle) * ss.speed;

                // Draw glowing trail
                const gradient = ctx.createLinearGradient(
                    ss.x, ss.y,
                    ss.x - Math.cos(ss.angle) * ss.length,
                    ss.y - Math.sin(ss.angle) * ss.length
                );
                gradient.addColorStop(0, `hsla(${ss.hue}, 80%, 70%, ${ss.opacity})`);
                gradient.addColorStop(0.3, `hsla(${ss.hue}, 60%, 60%, ${ss.opacity * 0.5})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                // Draw outer glow
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(
                    ss.x - Math.cos(ss.angle) * ss.length,
                    ss.y - Math.sin(ss.angle) * ss.length
                );
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Draw inner bright core
                const coreGradient = ctx.createLinearGradient(
                    ss.x, ss.y,
                    ss.x - Math.cos(ss.angle) * ss.length * 0.5,
                    ss.y - Math.sin(ss.angle) * ss.length * 0.5
                );
                coreGradient.addColorStop(0, `rgba(255, 255, 255, ${ss.opacity})`);
                coreGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(
                    ss.x - Math.cos(ss.angle) * ss.length * 0.5,
                    ss.y - Math.sin(ss.angle) * ss.length * 0.5
                );
                ctx.strokeStyle = coreGradient;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Update position
                ss.x += vx;
                ss.y += vy;
                ss.opacity -= 0.006;

                return ss.opacity > 0 && ss.x < canvas.width + 100 && ss.y < canvas.height + 100;
            });

            createShootingStar();
        }

        function animate(time) {
            drawStars(time);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate(0);

        // Add subtle parallax to container on mouse move
        const container = document.querySelector('.container');
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            container.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Poll prank - No button runs away
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const pollButtons = document.getElementById('pollButtons');
        const pollResult = document.getElementById('pollResult');
        const poll = document.getElementById('poll');

        let escapeCount = 0;

        function moveNoButton() {
            const pollRect = poll.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Calculate random position within reasonable bounds
            const maxX = 150;
            const maxY = 100;

            const randomX = (Math.random() - 0.5) * maxX;
            const randomY = (Math.random() - 0.5) * maxY;

            noBtn.style.position = 'relative';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            escapeCount++;

            // After a few escapes, make it more dramatic
            if (escapeCount > 3) {
                noBtn.style.transform = `rotate(${(Math.random() - 0.5) * 30}deg)`;
            }
            if (escapeCount > 5) {
                noBtn.textContent = ['Nope!', 'Try again!', 'Haha!', 'Too slow!', 'Nice try!'][Math.floor(Math.random() * 5)];
            }
            if (escapeCount > 8) {
                noBtn.style.fontSize = '0.7rem';
                noBtn.style.padding = '6px 12px';
            }
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Yes button shows result
        yesBtn.addEventListener('click', () => {
            pollButtons.style.display = 'none';
            pollResult.style.display = 'block';

            // Add confetti effect
            for (let i = 0; i < 20; i++) {
                createConfetti();
            }
        });

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.style.cssText = `
                position: fixed;
                width: 10px;
                height: 10px;
                background: hsl(${Math.random() * 360}, 80%, 60%);
                top: ${poll.getBoundingClientRect().top}px;
                left: ${poll.getBoundingClientRect().left + poll.offsetWidth / 2}px;
                pointer-events: none;
                border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                z-index: 1000;
            `;
            document.body.appendChild(confetti);

            const angle = (Math.random() * Math.PI * 2);
            const velocity = Math.random() * 8 + 4;
            let vx = Math.cos(angle) * velocity;
            let vy = Math.sin(angle) * velocity - 8;
            let x = parseFloat(confetti.style.left);
            let y = parseFloat(confetti.style.top);
            let rotation = 0;

            function animateConfetti() {
                vy += 0.3; // gravity
                x += vx;
                y += vy;
                rotation += vx * 2;

                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';
                confetti.style.transform = `rotate(${rotation}deg)`;
                confetti.style.opacity = Math.max(0, 1 - (y - poll.getBoundingClientRect().top) / 300);

                if (y < window.innerHeight + 50 && parseFloat(confetti.style.opacity) > 0) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    confetti.remove();
                }
            }
            requestAnimationFrame(animateConfetti);
        }
    </script>
